server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: postgres-mcp-server

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: NON_NULL

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.kasafal.mcp: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  database:
    max-connections: 10
    default-query-timeout: 30
    max-result-rows: 1000
    enable-query-logging: false

  mcp:
    server-name: "PostgreSQL MCP Server"
    server-version: "1.0.0"
    protocol-version: "2024-11-05"
    max-tool-calls: 100
    enable-detailed-errors: false

  encryption:
    password: ${ENCRYPTION_PASSWORD:bd1184cb5fca4437}
    salt: ${ENCRYPTION_SALT:3df95588aa625a4a}
  
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Session token cleanup configuration
  session:
    cleanup-interval-minutes: 5
    default-expiration-minutes: 60
    max-concurrent-tokens: 1000
