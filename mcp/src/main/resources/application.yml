server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: postgres-mcp-server

  datasource:
    url: jdbc:postgresql://localhost:5432/mcp_server
    username: mcp_user
    password: secure_password_123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
        generate_statistics: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: NON_NULL

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.yourorg.postgresmcp: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  database:
    max-connections: 10
    default-query-timeout: 30
    max-result-rows: 1000
    enable-query-logging: false

  mcp:
    server-name: "PostgreSQL MCP Server"
    server-version: "1.0.0"
    protocol-version: "2024-11-05"
    max-tool-calls: 100
    enable-detailed-errors: false

  encryption:
    password: bd1184cb5fca4437
    salt: 3df95588aa625a4a



---

spring:
  config:
    activate:
      on-profile: development

logging:
  level:
    com.yourorg.postgresmcp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  database:
    enable-query-logging: true
  mcp:
    enable-detailed-errors: true

---

spring:
  config:
    activate:
      on-profile: production

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mcp_server}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

logging:
  level:
    com.yourorg.postgresmcp: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

app:
  database:
    max-connections: 20
    enable-query-logging: false
  mcp:
    enable-detailed-errors: false