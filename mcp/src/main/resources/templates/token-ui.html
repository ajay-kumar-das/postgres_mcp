<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL MCP Server - Token Generation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .card {
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: none;
            border-radius: 15px;
        }
        .token-display {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 10px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }
        .operation-badge {
            font-size: 0.8em;
            margin: 2px;
        }
        .loading {
            display: none;
        }
        .success-message {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-key me-2"></i>
                            PostgreSQL MCP Server - Token Generation
                        </h4>
                    </div>
                    <div class="card-body">
                        <!-- Purpose Display -->
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>Purpose:</strong> <span th:text="${purpose}">Database access</span>
                        </div>
                        
                        <!-- Requested Operations -->
                        <div class="mb-3">
                            <label class="form-label"><strong>Requested Operations:</strong></label>
                            <div>
                                <span th:each="operation : ${requestedOperations}" 
                                      th:text="${operation}" 
                                      class="badge bg-secondary operation-badge">SELECT_QUERIES</span>
                            </div>
                        </div>

                        <!-- Token Generation Form -->
                        <form id="tokenForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Connection Name *</label>
                                        <input type="text" class="form-control" id="name" required 
                                               placeholder="e.g., My Production DB">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="host" class="form-label">Database Host *</label>
                                        <input type="text" class="form-control" id="host" required 
                                               placeholder="localhost" value="localhost">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="port" class="form-label">Port *</label>
                                        <input type="number" class="form-control" id="port" required 
                                               placeholder="5432" value="5432">
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <div class="mb-3">
                                        <label for="database" class="form-label">Database Name *</label>
                                        <input type="text" class="form-control" id="database" required 
                                               placeholder="mydb">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Username *</label>
                                        <input type="text" class="form-control" id="username" required 
                                               placeholder="postgres">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password *</label>
                                        <input type="password" class="form-control" id="password" required 
                                               placeholder="Enter database password">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="schema" class="form-label">Schema</label>
                                        <input type="text" class="form-control" id="schema" 
                                               placeholder="public" value="public">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="expirationMinutes" class="form-label">Expiration (minutes)</label>
                                        <input type="number" class="form-control" id="expirationMinutes" 
                                               placeholder="60" value="60" min="5" max="480">
                                    </div>
                                </div>
                            </div>

                            <!-- Allowed Operations -->
                            <div class="mb-3">
                                <label class="form-label">Allowed Operations</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="SCHEMA_DISCOVERY" 
                                                   id="op1" checked>
                                            <label class="form-check-label" for="op1">Schema Discovery</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="SELECT_QUERIES" 
                                                   id="op2" checked>
                                            <label class="form-check-label" for="op2">SELECT Queries</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="TABLE_SAMPLING" 
                                                   id="op3" checked>
                                            <label class="form-check-label" for="op3">Table Sampling</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="EXPLAIN_QUERIES" 
                                                   id="op4">
                                            <label class="form-check-label" for="op4">Explain Queries</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="CONNECTION_TEST" 
                                                   id="op5">
                                            <label class="form-check-label" for="op5">Connection Test</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <span class="loading">
                                    <i class="fas fa-spinner fa-spin me-2"></i>
                                    Generating Token...
                                </span>
                                <span class="normal-text">
                                    <i class="fas fa-key me-2"></i>
                                    Generate Token
                                </span>
                            </button>
                        </form>

                        <!-- Success Message -->
                        <div class="success-message mt-4">
                            <div class="alert alert-success">
                                <h5><i class="fas fa-check-circle me-2"></i>Token Generated Successfully!</h5>
                                <p class="mb-2">Your database access token:</p>
                                <div class="token-display" id="tokenDisplay">
                                    <!-- Token will be displayed here -->
                                </div>
                                <div class="mt-3">
                                    <button class="btn btn-outline-primary btn-sm" onclick="copyToken()">
                                        <i class="fas fa-copy me-1"></i> Copy Token
                                    </button>
                                    <small class="text-muted ms-3">
                                        <i class="fas fa-clock me-1"></i>
                                        Expires: <span id="expirationTime"></span>
                                    </small>
                                </div>
                            </div>
                            
                            <div class="alert alert-warning">
                                <i class="fas fa-exclamation-triangle me-2"></i>
                                <strong>Important:</strong> Copy this token and provide it to Claude. 
                                The token will expire after the specified time and will need to be regenerated.
                            </div>
                        </div>

                        <!-- Error Message -->
                        <div class="alert alert-danger d-none" id="errorMessage">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span id="errorText"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('tokenForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading state
            document.querySelector('.loading').style.display = 'inline';
            document.querySelector('.normal-text').style.display = 'none';
            document.querySelector('button[type="submit"]').disabled = true;
            
            // Hide previous messages
            document.querySelector('.success-message').style.display = 'none';
            document.getElementById('errorMessage').classList.add('d-none');
            
            // Collect form data
            const formData = {
                name: document.getElementById('name').value,
                host: document.getElementById('host').value,
                port: parseInt(document.getElementById('port').value),
                database: document.getElementById('database').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                schema: document.getElementById('schema').value || 'public',
                expirationMinutes: parseInt(document.getElementById('expirationMinutes').value) || 60,
                allowedOperations: Array.from(document.querySelectorAll('input[type="checkbox"]:checked'))
                    .map(cb => cb.value)
            };
            
            try {
                const response = await fetch('/api/session/tokens', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    
                    // Display token
                    document.getElementById('tokenDisplay').textContent = result.tokenId;
                    document.getElementById('expirationTime').textContent = new Date(result.expiresAt).toLocaleString();
                    document.querySelector('.success-message').style.display = 'block';
                    
                    // Scroll to result
                    document.querySelector('.success-message').scrollIntoView({ behavior: 'smooth' });
                } else {
                    let errorMessage = 'Failed to generate token';
                    try {
                        const errorData = await response.json();
                        if (errorData.message) {
                            errorMessage = errorData.message;
                        } else if (errorData.error) {
                            errorMessage = `${errorData.error}: ${errorData.details || 'Unknown error'}`;
                        }
                    } catch (parseError) {
                        // If JSON parsing fails, use response text
                        const errorText = await response.text();
                        if (errorText) {
                            errorMessage = errorText;
                        }
                    }
                    document.getElementById('errorText').textContent = errorMessage;
                    document.getElementById('errorMessage').classList.remove('d-none');
                    
                    // Scroll to error message
                    document.getElementById('errorMessage').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                document.getElementById('errorText').textContent = `Network error: ${error.message}`;
                document.getElementById('errorMessage').classList.remove('d-none');
            } finally {
                // Reset button state
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('.normal-text').style.display = 'inline';
                document.querySelector('button[type="submit"]').disabled = false;
            }
        });
        
        function copyToken() {
            const tokenText = document.getElementById('tokenDisplay').textContent;
            navigator.clipboard.writeText(tokenText).then(() => {
                // Show temporary feedback
                const btn = event.target.closest('button');
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check me-1"></i> Copied!';
                btn.classList.remove('btn-outline-primary');
                btn.classList.add('btn-success');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('btn-success');
                    btn.classList.add('btn-outline-primary');
                }, 2000);
            });
        }
    </script>
</body>
</html>
