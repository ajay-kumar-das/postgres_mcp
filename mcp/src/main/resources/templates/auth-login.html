<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --surface: #ffffff;
            --surface-subtle: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .auth-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }
        
        .auth-header {
            text-align: center;
            padding: 24px 24px 16px;
            background: var(--surface-subtle);
            border-bottom: 1px solid var(--border);
        }
        
        .auth-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }
        
        .auth-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin: 0 0 4px;
        }
        
        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }
        .auth-form {
            padding: 32px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }
        
        .form-section {
            display: grid;
            gap: 16px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group:last-child {
            margin-bottom: 0;
        }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-control::placeholder {
            color: #94a3b8;
            opacity: 1;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .form-row-triple {
            display: grid;
            grid-template-columns: 2fr 1fr 2fr;
            gap: 12px;
        }
        
        .btn-auth {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            color: white;
            background: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-auth:hover {
            background: var(--primary-dark);
        }
        
        .btn-auth:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading { display: none; }
        .success-screen { display: none; text-align: center; padding: 32px 24px; }
        .success-icon { width: 48px; height: 48px; background: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .alert { padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
        .alert-danger { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; gap: 16px; }
            .form-row, .form-row-triple { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            .auth-header, .auth-form { padding: 20px; }
            .auth-card { max-width: 500px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-database text-white"></i>
                </div>
                <h1 class="auth-title" th:text="'Connect to Database'">Connect to Database</h1>
                <p class="auth-subtitle" th:text="${source} + ' needs database access'">Application needs database access</p>
            </div>
            
            <!-- Form -->
            <div id="authForm">
                <div class="auth-form">
                            
                    <form id="databaseForm">
                        <input type="hidden" id="sessionId" th:value="${sessionId}">
                        
                        <div class="form-grid">
                            <!-- Left Column: Connection Details -->
                            <div class="form-section">
                                <h3 style="font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">Connection Details</h3>
                                
                                <div class="form-group">
                                    <label for="name" class="form-label">Connection Name</label>
                                    <input type="text" class="form-control" id="name" name="name" required 
                                           placeholder="My Database" autocomplete="off">
                                </div>
                                
                                <div class="form-row-triple">
                                    <div class="form-group">
                                        <label for="host" class="form-label">Host</label>
                                        <input type="text" class="form-control" id="host" name="host" required 
                                               placeholder="localhost" value="localhost" autocomplete="off">
                                    </div>
                                    <div class="form-group">
                                        <label for="port" class="form-label">Port</label>
                                        <input type="number" class="form-control" id="port" name="port" required 
                                               value="5432" min="1" max="65535">
                                    </div>
                                    <div class="form-group">
                                        <label for="database" class="form-label">Database</label>
                                        <input type="text" class="form-control" id="database" name="database" required 
                                               placeholder="mydb" autocomplete="off">
                                    </div>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="username" name="username" required 
                                               placeholder="postgres" autocomplete="username">
                                    </div>
                                    <div class="form-group">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" name="password" required
                                               autocomplete="current-password">
                                    </div>
                                </div>
                                
                                <div class="form-group">
                                    <label for="schema" class="form-label">Schema</label>
                                    <input type="text" class="form-control" id="schema" name="schema" required 
                                           placeholder="public" value="public" autocomplete="off">
                                </div>
                            </div>
                            
                            <!-- Right Column: Permissions -->
                            <div class="form-section">
                                <h3 style="font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px;">Database Access</h3>
                                
                                <div style="background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 8px; padding: 16px; height: fit-content;">
                                    <div th:if="${permissionCategories}" style="display: grid; gap: 12px;">
                                        <div th:each="category : ${permissionCategories}" style="margin-bottom: 8px;">
                                            <div style="font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px;" th:text="${category.key}">Category</div>
                                            <div style="display: grid; gap: 6px;">
                                                <label th:each="perm : ${category.value}" style="display: flex; align-items: center; font-size: 12px; color: var(--text-muted); cursor: pointer; padding: 2px 0;">
                                                    <input type="checkbox" class="permission-check" 
                                                           th:id="${perm.operation}"
                                                           th:checked="${perm.checked}"
                                                           th:data-operation="${perm.operation}"
                                                           style="margin-right: 8px; width: 14px; height: 14px;">
                                                    <span th:text="${perm.displayName}">Permission</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div th:unless="${permissionCategories}" style="font-size: 12px; color: var(--text-muted);">
                                        Using default permissions: Schema Discovery, Table Listing, SELECT Queries
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Full Width Button -->
                        <div class="form-group" style="margin-top: 24px;">
                            <button type="submit" class="btn-auth">
                                <span class="loading">
                                    <i class="fas fa-spinner fa-spin"></i>
                                    Connecting...
                                </span>
                                <span class="normal-text">
                                    <i class="fas fa-key"></i>
                                    Connect Database
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Success Screen -->
            <div id="successScreen" class="success-screen">
                <div class="success-icon">
                    <i class="fas fa-check text-white"></i>
                </div>
                <h2 style="font-size: 18px; font-weight: 600; margin: 0 0 8px; color: var(--text);">Connected Successfully!</h2>
                <p style="font-size: 13px; color: var(--text-muted); margin: 0 0 24px;">Database connection established</p>
                <button class="btn-auth" onclick="window.close()" style="background: #6b7280;">
                    <i class="fas fa-times"></i>
                    Close Window
                </button>
            </div>
            
            <!-- Error Display -->
            <div class="alert alert-danger d-none" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('databaseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Show loading state
            document.querySelector('.loading').style.display = 'flex';
            document.querySelector('.normal-text').style.display = 'none';
            document.querySelector('button[type="submit"]').disabled = true;
            
            // Hide previous errors
            document.getElementById('errorMessage').classList.add('d-none');
            
            // Collect selected permissions
            const selectedPermissions = [];
            document.querySelectorAll('.permission-check:checked').forEach(checkbox => {
                selectedPermissions.push(checkbox.dataset.operation);
            });
            
            // If no permissions selected, use defaults
            if (selectedPermissions.length === 0) {
                selectedPermissions.push('SCHEMA_DISCOVERY', 'TABLE_LISTING', 'SELECT_QUERIES', 'SQL_VALIDATION');
            }
            
            // Collect form data
            const formData = {
                sessionId: document.getElementById('sessionId').value,
                name: document.getElementById('name').value,
                host: document.getElementById('host').value,
                port: parseInt(document.getElementById('port').value),
                database: document.getElementById('database').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                schema: document.getElementById('schema').value,
                description: 'OAuth-style authentication session',
                requestedOperations: selectedPermissions
            };
            
            console.log('Submitting form data:', {
                ...formData,
                password: '[HIDDEN]' // Don't log password
            });
            
            try {
                const response = await fetch('/api/auth/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Show success screen
                    document.getElementById('authForm').style.display = 'none';
                    document.getElementById('successScreen').style.display = 'block';
                    
                    // Auto-close tab after 10 seconds
                    setTimeout(() => {
                        window.close();
                    }, 10000);
                    
                } else {
                    throw new Error(result.message || 'Authentication failed');
                }
                
            } catch (error) {
                document.getElementById('errorText').textContent = error.message;
                document.getElementById('errorMessage').classList.remove('d-none');
                
                // Reset button state
                document.querySelector('.loading').style.display = 'none';
                document.querySelector('.normal-text').style.display = 'flex';
                document.querySelector('button[type="submit"]').disabled = false;
            }
        });
    </script>
</body>
</html>
