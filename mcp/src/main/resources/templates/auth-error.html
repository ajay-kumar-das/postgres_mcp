<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL MCP - Authentication Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .card {
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: none;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body p-4 text-center">
                        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
                        <h4 class="text-danger mb-3">Authentication Error</h4>
                        
                        <div class="alert alert-danger">
                            <span th:text="${error}">Invalid or expired session</span>
                        </div>
                        
                        <p class="text-muted mb-4">
                            This authentication session is no longer valid. Please return to Claude and try again.
                        </p>
                        
                        <button class="btn btn-outline-secondary" onclick="window.close()">
                            <i class="fas fa-times me-2"></i>
                            Close Tab
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
