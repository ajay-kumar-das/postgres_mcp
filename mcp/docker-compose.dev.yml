version: '3.8'

services:
  postgres-mcp-dev:
    build: .
    container_name: postgres-mcp-server-dev
    ports:
      - "8080:8080"
      - "5005:5005"  # Debug port
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-development}
      - DB_HOST=postgres-dev
      - DB_PORT=5432
      - DB_NAME=${DEV_DB_NAME:-mcp_server_dev}
      - DB_USERNAME=${DEV_DB_USERNAME:-mcp_dev_user}
      - DB_PASSWORD=${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - JAVA_OPTS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - mcp-dev-network
    restart: "no"
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src:ro  # Mount source for hot reload (if using dev tools)

  postgres-dev:
    image: postgres:15-alpine
    container_name: postgres-mcp-db-dev
    environment:
      POSTGRES_DB: ${DEV_DB_NAME:-mcp_server_dev}
      POSTGRES_USER: ${DEV_DB_USERNAME:-mcp_dev_user}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
    ports:
      - "5433:5432"  # Different port for dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - mcp-dev-network
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_dev_user -d mcp_server_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local

networks:
  mcp-dev-network:
    driver: bridge